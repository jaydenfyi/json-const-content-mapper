[package]
versioned_files = ["package.json"]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[github]
owner = "jaydenfyi"
repo = "json-const-content-mapper"

[[workflows]]
name = "document-change"
[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"
[[workflows.steps]]
type = "Command"
command = "git switch -c release"
[[workflows.steps]]
type = "PrepareRelease"
[[workflows.steps]]
type = "Command"
command = 'git commit -m "chore: prepare release $version"'
[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"
[[workflows.steps]]
type = "CreatePullRequest"
base = "main"
[workflows.steps.title]
template = "chore: prepare release $version"
[workflows.steps.body]
template = "Merging this PR publishes the next npm version. Wait for CI and ensure this branch is up to date.\n\n$changelog"

[[workflows]]
name = "release"
[[workflows.steps]]
type = "Release"
