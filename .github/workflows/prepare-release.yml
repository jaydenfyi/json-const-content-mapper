name: Prepare release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.RELEASES_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0
        with:
          nub-version: "0.6.0"
          provision-node: false
          shim: false
          package-manager-cache: false
      - run: nub install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: hashFiles('.changeset/*.md', '!.changeset/README.md') != ''
        with:
          github-token: ${{ secrets.RELEASE_PR_TOKEN }}
          pr-base-branch: main
          script: nub run changeset version
          commit-message: "chore: release"
          pr-title: "chore: release"
