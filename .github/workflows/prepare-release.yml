name: Prepare release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.RELEASES_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.1
      - name: Prepare only when change files exist
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          shopt -s nullglob
          changes=(.changeset/*.md)
          if (( ${#changes[@]} == 0 )); then
            printf '%s\n' 'No change files; nothing to release.'
            exit 0
          fi
          knope prepare-release
